<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#161a3a">
<title>倒水排序</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="svg-defs" aria-hidden="true">
  <defs>
    <linearGradient id="glass-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.16" stop-color="#d5e6ff" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#8eaae4" stop-opacity="0.05"/>
      <stop offset="0.84" stop-color="#12203f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
    <clipPath id="vial-clip" clipPathUnits="objectBoundingBox">
      <path d="M0.37,0.062 C0.37,0.062,0.35,0.085,0.35,0.115 L0.35,0.162 C0.35,0.208,0.20,0.246,0.14,0.30 C0.08,0.354,0.08,0.40,0.08,0.446 L0.08,0.823 C0.08,0.931,0.26,0.977,0.50,0.977 C0.74,0.977,0.92,0.931,0.92,0.823 L0.92,0.446 C0.92,0.40,0.92,0.354,0.86,0.30 C0.80,0.246,0.65,0.208,0.65,0.162 L0.65,0.115 C0.65,0.085,0.63,0.062,0.63,0.062 Z"/>
    </clipPath>
  </defs>
</svg>
<div class="app">
  <header class="head">
    <div class="title-row">
      <h1><span class="logo" aria-hidden="true"></span><span id="title">倒水排序</span></h1>
      <div class="pills">
        <span class="pill" id="level">第 1 关</span>
        <span class="pill"><span id="moves-label">步数</span> <b id="moves">0</b></span>
        <select id="lang" class="lang" aria-label="Language"></select>
      </div>
    </div>
    <div class="actions">
      <button type="button" id="undo">撤销</button>
      <button type="button" id="restart">重开</button>
      <button type="button" id="hint">提示</button>
      <button type="button" id="add-vial" class="hidden">加瓶</button>
      <button type="button" id="skip" class="hidden">跳关</button>
    </div>
  </header>
  <main class="stage" id="stage">
    <div class="rack" id="rack" role="group" aria-label="水瓶"></div>
    <svg id="stream" aria-hidden="true">
      <path id="stream-glow"></path>
      <path id="stream-body"></path>
      <path id="stream-sheen"></path>
      <circle id="stream-drop"></circle>
    </svg>
  </main>
  <p class="tip">点一瓶拿起，再点另一瓶倒入。同色才能叠，空瓶也可以。</p>
  <p class="sr" id="status" aria-live="polite"></p>
  <div class="overlay hidden" id="overlay">
    <div class="card">
      <div class="card-mark" id="ov-mark">✓</div>
      <h2 id="ov-title"></h2>
      <p id="ov-text"></p>
      <div class="card-actions">
        <button type="button" class="ghost" id="ov-secondary"></button>
        <button type="button" class="primary" id="ov-primary"></button>
      </div>
    </div>
  </div>
</div>
<script>
window.WATER_ADS = {
  blockId: '56445',
  debug: false
};
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src="ads.js"></script>
<script src="i18n.js"></script>
<script src="logic.js"></script>
<script src="main.js"></script>
</body>
</html>
